<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">My To-Do List</a>
        </div>
    </nav>

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1 class="fw-bold">My Daily Tasks</h1>
            <p class="text-secondary">Organize your day and get things done!</p>
        </div>

        <div class="card shadow-sm mx-auto" style="max-width: 700px;">
            <div class="card-body p-4">

                <h4 class="mb-3">Add a New Task</h4>

                <div class="input-group mb-4">
                    <input type="text" id="taskInput" class="form-control" placeholder="Enter your task...">
                    <button class="btn btn-primary" onclick="addTask()">Add Task</button>
                </div>

                <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
                    <span class="badge text-bg-primary p-2">Total: <span id="totalTasks">0</span></span>
                    <span class="badge text-bg-warning p-2">Pending: <span id="pendingTasks">0</span></span>
                    <span class="badge text-bg-success p-2">Completed: <span id="completedTasks">0</span></span>
                </div>

                <h4 class="mb-3">My Tasks</h4>

                <ul class="list-group" id="taskList">
                    <li class="list-group-item text-center text-secondary" id="emptyMessage">
                        No tasks added yet. Start by adding a task!
                    </li>
                </ul>

            </div>
        </div>

    </div>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 My To-Do List Application</p>
    </footer>

    <script>
        let total = 0;
        let completed = 0;

        function addTask() {
            let input = document.getElementById("taskInput");
            let taskName = input.value.trim();

            if (taskName === "") {
                alert("Please enter a task!");
                return;
            }

            let emptyMessage = document.getElementById("emptyMessage");

            if (emptyMessage) {
                emptyMessage.remove();
            }

            let list = document.getElementById("taskList");

            let item = document.createElement("li");
            item.className = "list-group-item d-flex justify-content-between align-items-center gap-2";

            let taskDiv = document.createElement("div");
            taskDiv.className = "form-check flex-grow-1";

            let checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "form-check-input";

            let label = document.createElement("label");
            label.className = "form-check-label";
            label.textContent = taskName;

            checkbox.addEventListener("change", function() {
                if (checkbox.checked) {
                    label.classList.add("text-decoration-line-through", "text-secondary");
                    completed++;
                } else {
                    label.classList.remove("text-decoration-line-through", "text-secondary");
                    completed--;
                }
                updateCounter();
            });

            let deleteButton = document.createElement("button");
            deleteButton.className = "btn btn-danger btn-sm";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function() {
                if (checkbox.checked) {
                    completed--;
                }

                item.remove();
                total--;
                updateCounter();

                if (total === 0) {
                    list.innerHTML = '<li class="list-group-item text-center text-secondary" id="emptyMessage">No tasks added yet. Start by adding a task!</li>';
                }
            });

            taskDiv.appendChild(checkbox);
            taskDiv.appendChild(label);

            item.appendChild(taskDiv);
            item.appendChild(deleteButton);

            list.appendChild(item);

            total++;
            input.value = "";
            updateCounter();
        }

        function updateCounter() {
            document.getElementById("totalTasks").textContent = total;
            document.getElementById("completedTasks").textContent = completed;
            document.getElementById("pendingTasks").textContent = total - completed;
        }

        document.getElementById("taskInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
